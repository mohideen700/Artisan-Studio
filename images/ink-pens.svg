<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380">
  <rect width="620" height="380" fill="#faf8f5" rx="8" stroke="#dfd7cb"/>
  <text x="30" y="45" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1c1c1c">Inks, Dip Nibs &amp; Technical Fineliners</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#666">Waterproof Shellac India Inks, G-Pen Manga Nibs, Micron Fine Line Pens</text>
  
  <g transform="translate(30, 95)">
    <!-- Ink Bottle -->
    <rect x="30" y="35" width="110" height="130" rx="12" fill="#222" stroke="#444" stroke-width="2"/>
    <rect x="55" y="10" width="60" height="25" fill="#777" rx="3"/>
    <rect x="45" y="75" width="80" height="65" fill="#fffbe8" rx="4"/>
    <text x="52" y="102" font-family="serif" font-size="12" font-weight="bold" fill="#111">INDIA INK</text>
    <text x="56" y="120" font-family="sans-serif" font-size="9" fill="#777">BLACK &bull; 60ml</text>

    <!-- Dip Pen with G-Nib -->
    <g transform="rotate(-30 280 120)">
      <rect x="180" y="100" width="230" height="12" rx="6" fill="#803816"/>
      <polygon points="410,100 445,106 410,112" fill="#c0c0c0" stroke="#555"/>
      <line x1="430" y1="106" x2="445" y2="106" stroke="#111" stroke-width="1.5"/>
    </g>

    <!-- Technical Pen -->
    <g transform="rotate(-10 320 180)">
      <rect x="200" y="170" width="220" height="16" rx="3" fill="#dedede" stroke="#999"/>
      <rect x="400" y="170" width="20" height="16" fill="#111"/>
      <rect x="420" y="175" width="18" height="6" fill="#bbb"/>
      <text x="215" y="182" font-family="monospace" font-size="9" fill="#333">PIGMA MICRON 05 &bull; ARCHIVAL INK</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400">
  <rect width="620" height="400" fill="#faf7f2" rx="8" stroke="#dfd7cb"/>
  <text x="30" y="45" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2c221e">Graphite Hardness &amp; Value Scale</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#666">Standard European H/B Scale: 9H (Hard/Light) to 9B (Soft/Black)</text>
  
  <!-- Swatches and Pencils -->
  <g transform="translate(30, 95)">
    <!-- 4H -->
    <rect x="0" y="0" width="95" height="45" fill="#dedede" rx="4"/>
    <text x="38" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">4H</text>
    <rect x="0" y="55" width="95" height="14" fill="#c49e72"/>
    <polygon points="0,55 -22,62 0,69" fill="#ecd8b8"/>
    <polygon points="-15,60 -22,62 -15,64" fill="#888"/>

    <!-- 2H -->
    <rect x="115" y="0" width="95" height="45" fill="#bfbfbf" rx="4"/>
    <text x="153" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">2H</text>
    <rect x="115" y="55" width="95" height="14" fill="#c49e72"/>
    <polygon points="115,55 93,62 115,69" fill="#ecd8b8"/>
    <polygon points="100,60 93,62 100,64" fill="#666"/>

    <!-- HB -->
    <rect x="230" y="0" width="95" height="45" fill="#888888" rx="4"/>
    <text x="268" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">HB</text>
    <rect x="230" y="55" width="95" height="14" fill="#c49e72"/>
    <polygon points="230,55 208,62 230,69" fill="#ecd8b8"/>
    <polygon points="215,60 208,62 215,64" fill="#444"/>

    <!-- 2B -->
    <rect x="345" y="0" width="95" height="45" fill="#555555" rx="4"/>
    <text x="383" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">2B</text>
    <rect x="345" y="55" width="95" height="14" fill="#244b7a"/>
    <polygon points="345,55 323,62 345,69" fill="#ecd8b8"/>
    <polygon points="330,60 323,62 330,64" fill="#222"/>

    <!-- 6B -->
    <rect x="460" y="0" width="95" height="45" fill="#252525" rx="4"/>
    <text x="498" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">6B</text>
    <rect x="460" y="55" width="95" height="14" fill="#244b7a"/>
    <polygon points="460,55 438,62 460,69" fill="#ecd8b8"/>
    <polygon points="445,60 438,62 445,64" fill="#111"/>

    <!-- Tone Demonstration Bar -->
    <rect x="0" y="115" width="555" height="70" fill="#141414" rx="6"/>
    <text x="20" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffd700">8B Extra Dark Pure Graphite Core</text>
    <text x="20" y="168" font-family="sans-serif" font-size="13" fill="#bbb">Deep non-reflective tones for expressive rendering, dramatic shadows, and tonal depth</text>
  </g>
</svg>
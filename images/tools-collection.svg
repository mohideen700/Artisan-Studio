<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380">
  <rect width="620" height="380" fill="#f5ede0" rx="8" stroke="#dacbb5"/>
  <text x="30" y="45" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2d241e">Essential Artist Studio Accessories</text>
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#666">Drawing boards, metal rulers, masking tapes, and pencil sharpeners</text>
  
  <g transform="translate(30, 95)">
    <!-- Wooden Drawing Board -->
    <rect x="20" y="10" width="250" height="180" fill="#dbb98a" stroke="#a37e50" stroke-width="3" rx="4"/>
    <rect x="40" y="25" width="210" height="150" fill="#ffffff" stroke="#ccc"/>
    <circle cx="60" cy="45" r="7" fill="#888" stroke="#444"/>

    <!-- Steel Ruler -->
    <rect x="300" y="20" width="240" height="28" fill="#e0e0e0" stroke="#777" rx="2"/>
    <path d="M310,20 v10 M320,20 v6 M330,20 v10 M340,20 v6 M350,20 v10 M360,20 v6 M370,20 v10 M380,20 v6 M390,20 v10 M400,20 v6 M420,20 v10 M440,20 v10 M460,20 v10 M480,20 v10 M500,20 v10 M520,20 v10" stroke="#333" stroke-width="1.2"/>

    <!-- Masking Tape -->
    <circle cx="360" cy="120" r="42" fill="#ebdcc8" stroke="#948471" stroke-width="3"/>
    <circle cx="360" cy="120" r="24" fill="#f5ede0" stroke="#948471" stroke-width="2"/>

    <!-- Sandpaper Pointer -->
    <rect x="440" y="85" width="95" height="85" fill="#ba9667" stroke="#75562e" rx="3"/>
    <rect x="450" y="105" width="75" height="55" fill="#4a4036"/>
    <text x="454" y="138" fill="#bbb" font-size="9" font-family="sans-serif">SANDPAPER</text>
  </g>
</svg>
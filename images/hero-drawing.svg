<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eae2d6"/>
      <stop offset="100%" stop-color="#cfbeaa"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Studio Desk -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Sketchbook Paper -->
  <rect x="70" y="50" width="480" height="380" rx="8" fill="url(#paperGrad)" filter="url(#shadow)"/>
  <!-- Spiral binding strip -->
  <rect x="70" y="50" width="35" height="380" rx="4" fill="#3b2f2f"/>
  <g fill="#999" stroke="#333" stroke-width="1">
    <circle cx="87" cy="80" r="4"/><circle cx="87" cy="115" r="4"/><circle cx="87" cy="150" r="4"/>
    <circle cx="87" cy="185" r="4"/><circle cx="87" cy="220" r="4"/><circle cx="87" cy="255" r="4"/>
    <circle cx="87" cy="290" r="4"/><circle cx="87" cy="325" r="4"/><circle cx="87" cy="360" r="4"/>
    <circle cx="87" cy="395" r="4"/>
  </g>
  
  <!-- Realistic Classical Portrait Study on Sketchpad -->
  <g stroke="#3a302a" stroke-linecap="round">
    <!-- Face outline and hair sketch -->
    <path d="M220,180 C240,120 340,110 370,160 C400,210 390,290 340,340 C300,380 230,360 210,300 Z" fill="none" stroke-width="2" opacity="0.6"/>
    <!-- Expressive eye -->
    <path d="M250,220 Q290,195 330,220 Q290,245 250,220 Z" fill="none" stroke-width="3"/>
    <circle cx="290" cy="220" r="16" fill="#2d221c"/>
    <circle cx="285" cy="216" r="4" fill="#ffffff"/>
    <path d="M240,205 Q285,185 335,200" fill="none" stroke-width="3"/>
    <!-- Shading hatching lines -->
    <line x1="260" y1="240" x2="310" y2="280" stroke-width="1.5" opacity="0.4"/>
    <line x1="265" y1="245" x2="315" y2="285" stroke-width="1.5" opacity="0.4"/>
    <line x1="270" y1="250" x2="320" y2="290" stroke-width="1.5" opacity="0.4"/>
    <line x1="275" y1="255" x2="325" y2="295" stroke-width="1.5" opacity="0.4"/>
    <text x="140" y="405" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#7a6855">Graphite &amp; Carbon Study &bull; Plate 14</text>
  </g>

  <!-- Pencils on right side -->
  <g transform="rotate(-15 630 200)" filter="url(#shadow)">
    <!-- Wooden Hexagonal Graphite Pencil 6B -->
    <rect x="580" y="60" width="22" height="320" fill="#2b4c7e"/>
    <polygon points="580,60 591,15 602,60" fill="#edd0a4"/>
    <polygon points="588,30 591,15 594,30" fill="#1c1c1c"/>
    <rect x="580" y="380" width="22" height="20" fill="#d4af37"/>
    <text x="592" y="220" fill="#ffffff" font-size="11" font-family="'Arial', sans-serif" font-weight="bold" transform="rotate(90 592 220)">6B SOFT GRAPHITE</text>
  </g>

  <g transform="rotate(-5 670 230)" filter="url(#shadow)">
    <!-- Natural Vine Charcoal Stick -->
    <polygon points="650,80 670,80 668,410 648,410" fill="#151515"/>
    <polygon points="650,80 659,40 670,80" fill="#202020"/>
    <text x="660" y="240" fill="#999" font-size="10" font-family="monospace" transform="rotate(90 660 240)">VINE CHARCOAL</text>
  </g>

  <!-- Tortillon / Blending Stump -->
  <g transform="rotate(25 580 380)" filter="url(#shadow)">
    <polygon points="540,360 660,360 680,368 660,376 540,376" fill="#ebe4d8" stroke="#ccc"/>
    <polygon points="660,360 680,368 660,376" fill="#888"/>
  </g>

  <!-- Kneaded Art Eraser -->
  <path d="M120,380 C110,340 170,330 190,360 C210,390 180,420 140,410 C120,405 125,395 120,380 Z" fill="#6d7985" filter="url(#shadow)"/>
  <text x="135" y="380" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">ERASER</text>
</svg>